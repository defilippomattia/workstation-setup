---
- name: Configure Fedora workstation
  hosts: localhost
  connection: local
  become: true

  tasks:

    - name: Increase DNF parallel downloads
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        line: max_parallel_downloads=10
        create: true
    
    - name: Install packages
      ansible.builtin.dnf:
        name:
          - vim
          - go
          - chromium
          - keepassxc
          - gnome-tweaks
          - terraform
          - code
          - dnf-plugins-core
          - inxi
          - texlive-scheme-full
          - hugo
          - telnet
          - vlc
          - fastfetch
        state: present

    - name: Install Docker CE and related packages
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Install Obsidian from Flathub
      ansible.builtin.command:
        cmd: flatpak install -y flathub md.obsidian.Obsidian
        creates: /var/lib/flatpak/app/md.obsidian.Obsidian

    - name: Install Stremio from Flathub
      ansible.builtin.command:
        cmd: flatpak install -y flathub com.stremio.Stremio
        creates: /var/lib/flatpak/app/com.stremio.Stremio
    
    - name: Install DBeaver from Flathub
      ansible.builtin.command:
        cmd: flatpak install flathub io.dbeaver.DBeaverCommunity
        creates: /var/lib/flatpak/app/io.dbeaver.DBeaverCommunity

    - name: Install Bruno from Flathub
      ansible.builtin.command:
        cmd: flatpak install flathub com.usebruno.Bruno
        creates: /var/lib/flatpak/app/com.usebruno.Bruno

    - name: Swap ffmpeg-free for full ffmpeg
      ansible.builtin.command:
        cmd: dnf swap -y ffmpeg-free ffmpeg --allowerasing
      register: ffmpeg_swap
      changed_when: "'Nothing to do' not in ffmpeg_swap.stdout"

    - name: Swap mesa VA-API drivers to freeworld
      ansible.builtin.command:
        cmd: dnf swap -y mesa-va-drivers mesa-va-drivers-freeworld
      register: mesa_va_swap
      changed_when: "'Nothing to do' not in mesa_va_swap.stdout"

    - name: Swap mesa VDPAU drivers to freeworld
      ansible.builtin.command:
        cmd: dnf swap -y mesa-vdpau-drivers mesa-vdpau-drivers-freeworld
      register: mesa_vdpau_swap
      changed_when: "'Nothing to do' not in mesa_vdpau_swap.stdout"

    - name: Update firmware
      ansible.builtin.shell: |
        fwupdmgr refresh --force
        fwupdmgr get-updates
        fwupdmgr update -y