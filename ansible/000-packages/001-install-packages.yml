---
- name: Configure Fedora workstation
  hosts: localhost
  connection: local
  become: true

  tasks:

    - name: Increase DNF parallel downloads
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        line: max_parallel_downloads=10
        create: true
    
    - name: Install packages
      ansible.builtin.dnf:
        name:
          - vim
          - go
          - chromium
          - keepassxc
          - gnome-tweaks
          - terraform
          - code
          - dnf-plugins-core
          - inxi
          - texlive-scheme-full
          - hugo
        state: present

    - name: Install Docker CE and related packages
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Swap ffmpeg-free for full ffmpeg
      ansible.builtin.command:
        cmd: dnf swap -y ffmpeg-free ffmpeg --allowerasing
      register: ffmpeg_swap
      changed_when: "'Nothing to do' not in ffmpeg_swap.stdout"

    - name: Swap mesa VA-API drivers to freeworld
      ansible.builtin.command:
        cmd: dnf swap -y mesa-va-drivers mesa-va-drivers-freeworld
      register: mesa_va_swap
      changed_when: "'Nothing to do' not in mesa_va_swap.stdout"

    - name: Swap mesa VDPAU drivers to freeworld
      ansible.builtin.command:
        cmd: dnf swap -y mesa-vdpau-drivers mesa-vdpau-drivers-freeworld
      register: mesa_vdpau_swap
      changed_when: "'Nothing to do' not in mesa_vdpau_swap.stdout"

    - name: Update firmware
      ansible.builtin.shell: |
        fwupdmgr refresh --force
        fwupdmgr get-updates
        fwupdmgr update -y